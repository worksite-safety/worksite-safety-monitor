# Dependency updates for all four ecosystems this repository actually uses.
#
# Grouped and rate-limited on purpose. Ungrouped Dependabot on a project with a
# Spring Boot POM, a Vite front end and a CV stack opens twenty pull requests in
# the first week, each needing its own CI run and its own review; the reliable
# outcome is that all twenty are ignored and the security ones are ignored with
# them. Grouping minor and patch bumps into one PR per ecosystem per week keeps
# the number small enough to actually read - and MAJOR bumps are deliberately
# left ungrouped, because those are the ones that need a human.

version: 2

updates:

  # ---------------------------------------------------------------------------
  # engine - Maven.
  # ---------------------------------------------------------------------------
  - package-ecosystem: maven
    directory: /engine
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # THE 3.0.4 -> 3.5.x MIGRATION HAS LANDED. It went in with PR #13 and the
      # POM is on 3.5.16; the description that used to be here spoke of it as
      # pending, which stopped being true and then went on blocking things.
      #
      # What it blocked: `version-update:semver-minor` was in this list because
      # the migration was a migration - spring-kafka moving from a ZooKeeper
      # broker to KRaft, Spring Security 6.0 request-matcher APIs that
      # SecurityConfiguration uses directly - and a Dependabot PR could not have
      # done it. That reasoning expired on the day the upgrade merged, but the
      # rule did not, so 3.5.x -> 3.6.x was still being suppressed as though
      # nobody had done the work. Minor bumps within Boot 3 are now ordinary
      # bumps and are allowed through.
      #
      # WHAT REMAINS IS THE GUARD AGAINST BOOT 4, and it is still wanted, for
      # the same reason the 3.x one was: a major is a migration someone has to
      # drive. The Testcontainers integration tier is the oracle that makes it
      # safe to attempt, and it does not run on pull requests (see the note on
      # detector-integration in ci.yml for the same trade), so a major-version
      # PR would sit open, green on the checks that ran and untested on the ones
      # that matter. Do it deliberately, in its own branch.
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "build(engine)"
    labels: ["dependencies", "engine"]

  # ---------------------------------------------------------------------------
  # web - npm.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      # React and its ecosystem move together. Bumping react without react-dom
      # produces a lockfile that installs and an app that does not render, and
      # the failure surfaces in the browser rather than in CI.
      react:
        patterns: ["react", "react-dom", "react-router", "@types/react*"]
    commit-message:
      prefix: "build(web)"
    labels: ["dependencies", "web"]

  # ---------------------------------------------------------------------------
  # detector - pip.
  #
  # Dependabot reads dependencies and optional-dependencies out of
  # pyproject.toml. There is no lockfile, so these are constraint bumps: what
  # gets reviewed is the RANGE, not a resolved tree.
  # ---------------------------------------------------------------------------
  - package-ecosystem: pip
    directory: /detector
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # `ultralytics>=8.3,<8.4` is pinned to a minor series on purpose, and the
      # upper bound is load bearing. annotate.py imports
      # ultralytics.utils.plotting.Annotator for its COCO skeleton table, and
      # that module has already moved once in this project's lifetime -
      # aiModule.py imports it from ultralytics.yolo.utils.plotting, a path
      # deleted in 8.1, which is why the original file cannot be executed at all
      # today. The integration tier is what would catch the next move, and it
      # runs nightly rather than on every PR, so an automated minor bump could
      # merge on a green PR and break the detector until the next night.
      - dependency-name: ultralytics
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: "build(detector)"
    labels: ["dependencies", "detector"]

  # ---------------------------------------------------------------------------
  # GitHub Actions.
  #
  # NOTE what this does NOT cover: the pinned GITLEAKS_VERSION in ci.yml. That
  # is a version string inside a shell step, not an action reference, so nothing
  # here can see it. The reason it is a shell step at all is in the comment
  # beside it in ci.yml.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
