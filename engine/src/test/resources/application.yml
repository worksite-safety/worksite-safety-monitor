# Test configuration.
#
# This file SHADOWS src/main/resources/application.yml: target/test-classes precedes
# target/classes on the test classpath, so `classpath:/application.yml` resolves here and
# the production file is never read during a test run. That is deliberate - no test can
# reach real credentials, a real broker or a real database even if it forgets
# @ActiveProfiles("test").
#
# Every ${...} placeholder referenced from src/main must resolve here:
#   spring.kafka.bootstrap-servers  -> KafkaConsumerConfig
#   kafka.raw-event.topic           -> KafkaTopicConfig, RawEventService @KafkaListener
#   kafka.raw-event.group-id        -> RawEventService @KafkaListener
#   spring.mail.host/port/username/password -> MailConfig
#   spring.mail.username            -> MailService (fromMail)
#   event.image.path                -> EventController
#   event.periodic.min-duration-ms  -> RawEventService
#   event.periodic.input-unit       -> RawEventService
spring:
  data:
    mongodb:
      # Placeholder only. Nothing here is expected to be reachable; Boot builds the
      # MongoClient lazily, so this does not connect at context startup.
      uri: mongodb://localhost:27017/engine-test
      auto-index-creation: false

  mail:
    host: localhost
    port: 3025
    username: test@localhost
    password: test-password
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 1000
          timeout: 1000
          writetimeout: 1000

  kafka:
    # Fast-failing: nothing listens on port 1, so a connection attempt is refused
    # immediately instead of hanging on a retry/backoff loop.
    bootstrap-servers: localhost:1
    # WARNING: everything below this line is INERT and is kept only as documentation of that
    # fact. KafkaConsumerConfig declares a bean literally named "kafkaListenerContainerFactory",
    # which is the name Spring Boot's auto-configured factory would have taken, so Boot backs
    # off and neither KafkaProperties nor ConcurrentKafkaListenerContainerFactoryConfigurer is
    # ever applied. Verified: with auto-startup false the listener container still starts.
    #
    # Only spring.kafka.bootstrap-servers above has any effect, because KafkaConsumerConfig
    # reads it by hand with @Value. auto-offset-reset and the consumer group id are set in
    # KafkaConsumerConfig and on the @KafkaListener respectively; do NOT change them here and
    # expect anything to happen. See the "Known limitation" section of KafkaConsumerConfig.
    listener:
      auto-startup: false
    consumer:
      group-id: test-group
      auto-offset-reset: earliest

kafka:
  raw-event:
    topic: rawEvents-test
    group-id: rawEvents-test-group

springdoc:
  swagger-ui:
    path: /docs/swagger-ui.html
  api-docs:
    path: /docs

event:
  image:
    path: "target/test-images/"
  periodic:
    # MILLIS, while src/main defaults to SECONDS. Deliberate, and it must be set HERE rather than
    # with @TestPropertySource on the one IT that needs it.
    #
    # RawEventListenerIT's payload() helper emits the REWRITTEN detector's wire shape, which is
    # milliseconds in both time fields, so the engine has to be told MILLIS for that IT to assert
    # the stored value equals the value it sent.
    #
    # WHY NOT @TestPropertySource: any property override gives that class its own Spring context
    # key, so the suite builds a SECOND context. Both contexts start a @KafkaListener container in
    # consumer group ${kafka.raw-event.group-id} against a one-partition topic, the first context
    # to boot keeps the only partition, and every test in the second dies on
    # "Expected 1 but got 0 partitions" after a 60 s wait. Measured, not theorised. One context
    # for the whole IT suite is load-bearing here, exactly as it is for the static containers in
    # AbstractIntegrationTest.
    #
    # The SECONDS path is not left uncovered: RawEventServiceTest exercises both units directly,
    # and the unit is a boundary concern that never reaches the broker or the mapper.
    input-unit: MILLIS
    min-duration-ms: 3000

logging:
  level:
    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR
    org.mongodb.driver: ERROR
