spring:
  data:
    mongodb:
      database: graduation-project-document
      host: localhost
      port: 27017
  jpa:
    hibernate:
      ddl-auto: create-drop

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}


    properties:
      email:
        smtp:
          starttls:
            enable: true
  kafka:
    bootstrap-servers: localhost:9092
kafka:
  raw-event:
    topic: rawEvents
    # Consumed by @KafkaListener on RawEventService. Previously hardcoded there as
    # "groupId1"; externalised so the topic and the group can be pointed elsewhere
    # (per-environment, or per-test) without recompiling.
    group-id: groupId1

springdoc:
  swagger-ui:
    path: /docs/swagger-ui.html
  api-docs:
    path: /docs

event:
  image:
    path: "${EVENT_IMAGE_PATH}"
  periodic:
    # The unit the DETECTOR currently sends timePeriod in - a fact about the deployed producer,
    # not a preference. The engine normalises to milliseconds on ingest, so this is the single
    # knob that lets the two sides deploy independently:
    #
    #   SECONDS  the producer in the field before the detector rewrite (int(seconds))
    #   MILLIS   the rewritten detector
    #
    # FLIP THIS TO MILLIS AS PART OF THE DETECTOR RELEASE. Until then it must stay SECONDS:
    # a millisecond producer read as seconds stores 33 ms flickers as if they were violations,
    # and a seconds producer read as milliseconds stores nothing at all. Both are silent.
    input-unit: SECONDS
    # The shortest periodic violation worth storing. Was event.fall.threshold.value: 3, which
    # named the wrong event family and carried no unit; 3 meant 3 seconds. Storage and this
    # threshold are both milliseconds now, so the same intent is 3000.
    min-duration-ms: 3000
  migration:
    periodic-to-millis:
      # One-shot ApplicationRunner that rewrites pre-existing NO_HELMET/NO_JACKET documents from
      # seconds to milliseconds and stamps schemaVersion=2. Idempotent, but OFF by default: a
      # data migration must be something an operator turns on deliberately for one boot, never
      # something that fires because a pod restarted.
      enabled: false

