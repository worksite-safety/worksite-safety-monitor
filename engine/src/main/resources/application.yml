spring:
  data:
    mongodb:
      database: graduation-project-document
      host: localhost
      port: 27017
  jpa:
    hibernate:
      ddl-auto: create-drop

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}


    properties:
      email:
        smtp:
          starttls:
            enable: true
  kafka:
    bootstrap-servers: localhost:9092
kafka:
  raw-event:
    topic: rawEvents
    # Consumed by @KafkaListener on RawEventService. Previously hardcoded there as
    # "groupId1"; externalised so the topic and the group can be pointed elsewhere
    # (per-environment, or per-test) without recompiling.
    group-id: groupId1

springdoc:
  swagger-ui:
    path: /docs/swagger-ui.html
  api-docs:
    path: /docs

event:
  image:
    path: "${EVENT_IMAGE_PATH}"
  fall:
    threshold:
      value: 3

