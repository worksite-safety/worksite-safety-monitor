spring:
  data:
    mongodb:
      database: graduation-project-document
      host: localhost
      port: 27017
  jpa:
    hibernate:
      ddl-auto: create-drop

  mail:
    host: smtp.gmail.com
    port: 587
    # Both halves of the SMTP credential are required at startup - no fallback, same rule as
    # jwt.secret below. username is not merely an account name: MailService uses it as the From
    # address of every fall alert and every password-reset mail, so a default would put a wrong,
    # committed identity on outbound mail rather than failing.
    username: ${MAIL_USERNAME}
    # NO DEFAULT, DELIBERATELY.
    #
    # REVOKE THE OLD ONE - it is not enough that it is gone from here. A Gmail app password was
    # committed in this field. It has been removed from the working tree and rewritten out of the
    # history, but it was public for as long as it was pushed: it may sit in forks, in clones, in
    # CI caches and in anything that mirrored this repository, none of which a history rewrite can
    # reach. Until the password is revoked in the Google account that issued it, that account can
    # still be used to send mail as this application. Revoke first, then issue a new app password
    # and set it here through the environment.
    password: ${MAIL_PASSWORD}


    properties:
      email:
        smtp:
          starttls:
            enable: true
  kafka:
    bootstrap-servers: localhost:9092
kafka:
  raw-event:
    topic: rawEvents
    # Consumed by @KafkaListener on RawEventService. Previously hardcoded there as
    # "groupId1"; externalised so the topic and the group can be pointed elsewhere
    # (per-environment, or per-test) without recompiling.
    group-id: groupId1

jwt:
  # NO DEFAULT, DELIBERATELY. `${JWT_SECRET}` with no `:fallback` means Spring fails placeholder
  # resolution and the context refuses to start when the variable is missing. That is the intended
  # behaviour: a service that boots with a weak or well-known signing key issues tokens anyone can
  # forge and reports nothing wrong, which is far worse than a service that will not boot.
  #
  # Must be Base64 and decode to at least 256 bits (32 bytes) - HS256's minimum, enforced by
  # Keys.hmacShaKeyFor in JwtService's constructor. Generate one with:
  #     openssl rand -base64 48
  #
  # ROTATE, do not merely externalise. The key this field used to hold is in this repository's git
  # history and cannot be removed from clones that already exist. Moving it to an environment
  # variable does not un-leak it. Issue a NEW secret; every token signed with the old one stops
  # verifying the moment you do, which logs every current session out.
  secret: ${JWT_SECRET}
  # Token lifetime. Was the literal `1000 * 60 * 20` inside JwtService.generateToken, where it
  # could not be changed per environment or asserted on.
  expiration-ms: 1200000

password-reset:
  # NO DEFAULT, DELIBERATELY - same rule, and the same reason, as jwt.secret above.
  #
  # This key encrypts the e-mail address that becomes the ?token= of a password-reset link, and
  # decrypts it again to decide whose password to change. The token has no expiry and is not
  # revocable, so ANYONE HOLDING THIS KEY CAN MINT A VALID RESET LINK FOR ANY ADDRESS. It is an
  # account-takeover key, not a config value.
  #
  # Must be Base64 and decode to 16, 24 or 32 bytes (AES-128/192/256), enforced in
  # PasswordService's constructor. Generate one with:
  #     openssl rand -base64 32
  #
  # ROTATE, do not merely externalise. This field used to hold a 16-character literal in
  # PasswordService.java, and that string is in three blobs of this repository's git history -
  # it cannot be removed from clones that already exist, and the repository is headed for public
  # release. Moving it here does not un-leak it. Issue a NEW key; every reset link already sent
  # stops working the moment you do, which is correct, because every one of them is forgeable by
  # anyone who can read the history.
  aes-key: ${PASSWORD_RESET_AES_KEY}

app:
  # The zone in which "which day did this happen on" is answered, for EVERY surface that answers
  # it: /event/countable-events, /event/periodic-events and the timestamps in the emailed PDF
  # report. Read once by EventService's constructor.
  #
  # It exists because those three used to disagree. Two read ZoneId.systemDefault() and one divided
  # the epoch by 86_400_000 (hard-wired UTC), so on any host not set to UTC a single event near
  # midnight was counted on one day by one chart and on the adjacent day by the chart beside it,
  # with nothing in the output to say so.
  #
  # UTC by default because it is the same everywhere and matches what the periodic chart already
  # did, so existing stored data buckets exactly as it did before. Set it to the worksite's own zone
  # (e.g. Europe/Istanbul) to get local days - all three surfaces move together, which is the point.
  #
  # Must be an IANA zone id. ZoneId.of rejects the three-letter abbreviations that
  # TimeZone.getTimeZone would silently map to GMT, so a typo fails startup rather than quietly
  # behaving as UTC.
  timezone: ${APP_TIMEZONE:UTC}

  frontend:
    # Origin of the React app, used by MailService to build the password-reset link.
    #
    # This was the literal "http://localhost:3000/change-password" inside MailService. Every reset
    # mail a deployed instance sent pointed the recipient at their OWN machine, where nothing was
    # listening. The mail was accepted, the link was dead, and the server had no way to know - the
    # only symptom is a user who says the reset never worked.
    #
    # No trailing slash needed; MailService strips one if present.
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}

  cors:
    # Origins allowed to call this API from a browser. Comma-separated; bound into the
    # CorsConfigurationSource bean in SecurityConfiguration.
    #
    # This replaces a bare @CrossOrigin on EventController and UserController. With no attributes
    # that annotation means allowedOrigins = "*", so ANY site could make cross-origin calls to this
    # API and read the responses - including /event/get_image/**, which is public and serves the
    # worksite camera frame.
    #
    # MUST NOT be "*". SecurityConfiguration rejects a wildcard at startup rather than accepting a
    # value that reinstates the defect; set the deployed frontend's exact origin(s) instead.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /docs/swagger-ui.html
  api-docs:
    path: /docs

event:
  image:
    # Directory holding output_image.jpg, the single frame the detector overwrites and
    # EventController.getImage serves as the "video stream".
    #
    # The default is RELATIVE and resolves against the engine's working directory, so a fresh
    # checkout runs with no configuration at all. It used to be an absolute path into a former
    # developer's OneDrive folder, which meant the preview was broken on every machine but one -
    # and broken silently, as a 404 from a public endpoint with nothing in a log to explain it.
    # Not a secret, so requiring the variable would only trade a broken preview for a failed boot.
    #
    # The default is "../detector/" because the documented run command is ./mvnw spring-boot:run
    # FROM engine/, so the process working directory is engine/ and detector/ is its sibling.
    # Launching from the repository root instead needs EVENT_IMAGE_PATH set explicitly; compose
    # sets it either way rather than relying on where the process happened to start.
    path: "${EVENT_IMAGE_PATH:../detector/}"
  periodic:
    # The unit the DETECTOR currently sends timePeriod in - a fact about the deployed producer,
    # not a preference. The engine normalises to milliseconds on ingest, so this is the single
    # knob that lets the two sides deploy independently:
    #
    #   SECONDS  the producer in the field before the detector rewrite (int(seconds))
    #   MILLIS   the rewritten detector
    #
    # FLIP THIS TO MILLIS AS PART OF THE DETECTOR RELEASE. Until then it must stay SECONDS:
    # a millisecond producer read as seconds stores 33 ms flickers as if they were violations,
    # and a seconds producer read as milliseconds stores nothing at all. Both are silent.
    input-unit: SECONDS
    # The shortest periodic violation worth storing. Was event.fall.threshold.value: 3, which
    # named the wrong event family and carried no unit; 3 meant 3 seconds. Storage and this
    # threshold are both milliseconds now, so the same intent is 3000.
    min-duration-ms: 3000
  migration:
    periodic-to-millis:
      # One-shot ApplicationRunner that rewrites pre-existing NO_HELMET/NO_JACKET documents from
      # seconds to milliseconds and stamps schemaVersion=2. Idempotent, but OFF by default: a
      # data migration must be something an operator turns on deliberately for one boot, never
      # something that fires because a pod restarted.
      enabled: false

