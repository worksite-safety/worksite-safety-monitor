spring:
  data:
    mongodb:
      database: graduation-project-document
      host: localhost
      port: 27017
  jpa:
    hibernate:
      ddl-auto: create-drop

  kafka:
    bootstrap-servers: localhost:9092
kafka:
  raw-event:
    topic: rawEvents
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}


    properties:
      mail:
        smtp:
          starttls:
            enable: true
